name: Build Android Kotlin APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klencod-kotlin-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      # إعداد Gradle من النظام لضمان الاستقرار
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # حذف ملفات الـ Wrapper التالفة حتى لا يحاول استخدامها
      - name: Remove corrupt Gradle wrapper
        run: |
          rm -rf gradle/wrapper/
          rm -f gradlew gradlew.bat
          echo "✅ تم حذف ملفات الـ Wrapper التالفة"

      # البناء باستخدام Gradle العادي
      - name: Build debug APK
        shell: bash
        run: |
          gradle --no-daemon --build-cache --parallel \
            :app:assembleDebug -x lint -x test

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: klencod-kotlin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7